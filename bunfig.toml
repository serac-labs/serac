[install]
exact = true
# Only install newly resolved package versions published at least 3 days ago —
# the window in which most malicious npm releases are caught and unpublished.
# packages/servicenow-mcp repeats this in its own bunfig.toml, because it is
# built and installed outside this workspace too (its Docker context is that
# directory, not the repo root).
minimumReleaseAge = 259200

[test]
# `bun test` from the root would walk every package at once and pick up the two
# suites' fixtures in one process. Run tests from the package directory, or use
# `bun test` at the root only through turbo (`bun run test`).
root = "./do-not-run-tests-from-root"
