name: Bug report
description: Report something that is broken (avoid pasting giant AI generated summaries or your issue may be closed/ignored)
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug you encountered
      placeholder: What happened, and what did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - servicenow-mcp (a snow_* tool)
        - servicenow-mcp (server, transport or auth)
        - skills (a SKILL.md guide)
        - build / CI / packaging
        - not sure
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool name
      description: If a specific tool misbehaved, which one?
      placeholder: e.g., snow_query_table
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @serac-labs/servicenow-mcp`, or the commit you are on
    validations:
      required: false

  - type: input
    id: client
    attributes:
      label: MCP client
      description: What is connected to the server?
      placeholder: e.g., Claude Code, Claude Desktop, Cursor, custom
    validations:
      required: false

  - type: input
    id: servicenow
    attributes:
      label: ServiceNow release
      description: Which family, and is it a developer instance or a real one?
      placeholder: e.g., Xanadu, developer instance
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: |
        The error or unexpected response. Set `SNOW_MCP_DEBUG=true` for verbose server logging.
        Redact instance URLs, credentials and record data before pasting.
      render: text
    validations:
      required: false
