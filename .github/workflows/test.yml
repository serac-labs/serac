name: test

# Unit tests for the two packages this repo still contains:
# packages/servicenow-mcp and packages/skills.
#
# The previous test.yml was opencode's: a linux+windows matrix, a
# `working-directory: packages/opencode` HttpApi gate, and a Playwright e2e job
# driving packages/app. All three targets are gone. What survives is the part
# that still has something to run — `bun turbo test:ci`, which both remaining
# packages define.
#
# It also triggered on push to `dev`, opencode's default branch. Serac's default
# branch is `main`, so on this repo the push trigger never fired. Fixed here and
# in typecheck.yml.
#
# Linux only, deliberately. The old windows leg existed for the TUI and the
# node-pty/file-watcher code that went with it. Nothing left in this repo has a
# windows-specific code path, and turning on a matrix leg nobody has ever run
# green would land this workflow red on arrival. Re-add it with evidence, not
# by default.
#
# publish-mcp.yml also runs these tests, but only on PRs that touch
# packages/servicenow-mcp — it is a release gate, not the test suite. This is
# what runs on every push and every PR, including the skills package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run unit tests
        timeout-minutes: 10
        run: bun turbo test:ci --log-order=stream --log-prefix=task

      # tools.json is generated from the tool sources but published by being
      # COMMITTED — docs.serac.build fetches it from main over
      # raw.githubusercontent.com. So it can disagree with the code it
      # describes without anything failing, and it did: it sat at 429 tools
      # while the tree had 437, missing all eight snow_fluent_* tools from the
      # moment they landed. The public tool reference was wrong for two months.
      #
      # Nothing regenerated it. Two comments in the platform repo credit a
      # `.github/workflows/generate-tools-json.yml` for keeping it fresh; that
      # workflow has never existed in this repo's history. This step is the
      # automation those comments assumed was already there.
      #
      # --check only reads: it walks the tool sources, imports each one and
      # compares against the committed manifest. It never writes, so it cannot
      # "fix" drift into a green run.
      - name: Check tools.json is not stale
        timeout-minutes: 10
        run: bun run --cwd packages/servicenow-mcp generate:tools-json:check

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: "unit results"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: packages/*/.artifacts/unit/junit.xml
