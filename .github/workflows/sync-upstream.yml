name: Sync from opencode

# Weekly automated sync of upstream opencode (anomalyco/opencode@dev) into serac.
# Serac is a thin ADDITIVE layer on top of a SHARED opencode base, so a merge
# pulls in new opencode commits while preserving serac's own commits. A clean
# merge pushes the sync/upstream branch and notifies via (in order of what the
# org/repo allows) a PR, else an issue, and ALWAYS a run summary with a one-click
# compare link. On conflicts it notifies the same way. Nothing reaches main
# without a human merge. The job never fails on a missing notification channel.

# SCHEDULE REMOVED 2026-08-15. serac is being reduced to the ServiceNow MCP and
# the skills; everything inherited from opencode is on its way out. A weekly job
# that merges upstream back in works directly against that — it re-entangles the
# code being detangled and generates review work for a base we are removing.
# Left dispatchable rather than deleted: turning it back on is one click if the
# direction changes, and the merge machinery here is not trivial to rebuild.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'serac-labs/serac'
    env:
      HUSKY: "0" # CI must not run the local dev git hooks (the pre-push typecheck
      # would block pushing a sync branch that intentionally still has work to do).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git + fetch upstream opencode
        run: |
          git config user.name "serac-bot"
          git config user.email "bot@serac.build"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev

      - name: Count new upstream commits
        id: check
        run: echo "behind=$(git rev-list --count HEAD..upstream/dev)" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B sync/upstream main
          if git merge --no-edit upstream/dev; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-bun
        if: steps.merge.outputs.result == 'clean'

      - name: Typecheck the merged tree
        id: tc
        if: steps.merge.outputs.result == 'clean'
        continue-on-error: true
        run: |
          bun install || true
          if bun turbo typecheck; then
            echo "verdict=✅ monorepo typecheck green" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=⚠️ monorepo typecheck FAILED — resolve before merging" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify (clean merge → PR, else issue, always a run summary)
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e # best-effort notifications; the step ends with exit 0
          git push --force --no-verify origin sync/upstream
          BEHIND="${{ steps.check.outputs.behind }}"
          VERDICT="${{ steps.tc.outputs.verdict }}"
          TITLE="⬆️ Sync from opencode ($BEHIND new commits)"
          COMPARE="https://github.com/serac-labs/serac/compare/main...sync/upstream?expand=1"

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Automated merge of upstream \`anomalyco/opencode@dev\` into \`main\`.

          - **$BEHIND** new opencode commits, merged cleanly on top of serac's layer.
          - $VERDICT

          Serac's own additions are preserved by the merge. Review the diff and merge when green.

          _Opened automatically by \`sync-upstream.yml\`._
          EOF

          # Always leave a run summary — needs no special permissions.
          {
            echo "## $TITLE"
            echo ""
            echo "- **$BEHIND** new opencode commits merged onto \`sync/upstream\`"
            echo "- $VERDICT"
            echo "- 👉 [Open the PR]($COMPARE)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Prefer a PR; if the org blocks Actions from opening PRs, fall back to an issue.
          if gh pr view sync/upstream --json number >/dev/null 2>&1; then
            gh pr edit sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          elif gh pr create --base main --head sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then
            echo "opened PR"
          else
            echo "::notice::Auto-PR blocked (enable the serac-labs org 'Allow GitHub Actions to create and approve pull requests' setting). Falling back to an issue."
            NUM=$(gh issue list --search "Sync from opencode in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            fi
          fi
          exit 0

      - name: Notify (conflict → issue, always a run summary)
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BEHIND="${{ steps.check.outputs.behind }}"
          TITLE="⚠️ Upstream opencode sync needs manual merge"
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          Upstream \`anomalyco/opencode@dev\` is **$BEHIND** commits ahead and the automated merge hit conflicts.

          Resolve locally:
          \`\`\`sh
          git fetch upstream dev && git checkout main && git merge upstream/dev
          # resolve the conflicts, then: git push
          \`\`\`

          Conflicting files:
          $(sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt")

          _Opened automatically by \`sync-upstream.yml\`._
          EOF

          {
            echo "## $TITLE"
            echo ""
            echo "Upstream is **$BEHIND** commits ahead; the auto-merge conflicts. Resolve locally:"
            echo '```sh'
            echo "git fetch upstream dev && git checkout main && git merge upstream/dev"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          NUM=$(gh issue list --search "Upstream opencode sync needs manual merge in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 0
