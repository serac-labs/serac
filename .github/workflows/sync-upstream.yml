name: Sync from opencode

# Weekly automated sync of upstream opencode (anomalyco/opencode@dev) into serac.
# Serac is a thin ADDITIVE layer on top of a SHARED opencode base, so a merge
# pulls in new opencode commits while preserving serac's own commits. On a clean
# merge it opens/updates a review PR (with a monorepo-typecheck verdict); if the
# org blocks Actions from opening PRs, it falls back to a notification issue with
# a one-click compare link. On conflicts it opens/updates a tracking issue.
# Nothing reaches main without a human merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'serac-labs/serac'
    env:
      HUSKY: "0" # CI must not run the local dev git hooks (the pre-push typecheck
      # would block pushing a sync branch that intentionally still has work to do).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git + fetch upstream opencode
        run: |
          git config user.name "serac-bot"
          git config user.email "bot@serac.build"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev

      - name: Count new upstream commits
        id: check
        run: echo "behind=$(git rev-list --count HEAD..upstream/dev)" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B sync/upstream main
          if git merge --no-edit upstream/dev; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-bun
        if: steps.merge.outputs.result == 'clean'

      - name: Typecheck the merged tree
        id: tc
        if: steps.merge.outputs.result == 'clean'
        continue-on-error: true
        run: |
          bun install || true
          if bun turbo typecheck; then
            echo "verdict=✅ monorepo typecheck green" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=⚠️ monorepo typecheck FAILED — resolve before merging" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the sync PR (fall back to an issue if the org blocks it)
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force --no-verify origin sync/upstream
          BEHIND="${{ steps.check.outputs.behind }}"
          VERDICT="${{ steps.tc.outputs.verdict }}"
          TITLE="⬆️ Sync from opencode ($BEHIND new commits)"

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Automated merge of upstream \`anomalyco/opencode@dev\` into \`main\`.

          - **$BEHIND** new opencode commits, merged cleanly on top of serac's layer.
          - $VERDICT

          Serac's own additions are preserved by the merge. Review the diff and merge when green.

          _Opened automatically by \`sync-upstream.yml\`._
          EOF

          # Already an open PR for the branch? Just update it.
          if gh pr view sync/upstream --json number >/dev/null 2>&1; then
            gh pr edit sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi
          # Try to open the PR (works when the org allows Actions to create PRs).
          if gh pr create --base main --head sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" 2>"$RUNNER_TEMP/prerr.txt"; then
            exit 0
          fi

          echo "::warning::Auto-PR blocked — falling back to a notification issue. $(cat "$RUNNER_TEMP/prerr.txt")"
          gh label create upstream-sync --color FBCA04 --description "Automated opencode upstream sync" --force >/dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          The sync branch \`sync/upstream\` is ready: **$BEHIND** new opencode commits merged on top of serac's layer.

          - $VERDICT

          GitHub Actions can't open the PR (the org setting *Allow GitHub Actions to create and approve pull requests* is off). Open it yourself:
          👉 https://github.com/serac-labs/serac/compare/main...sync/upstream?expand=1

          Enable that setting in the **serac-labs org → Settings → Actions → General** to get real auto-PRs instead of this issue.

          _Opened automatically by \`sync-upstream.yml\`._
          EOF
          EXISTING=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label upstream-sync --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Open / update the conflict issue
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --color FBCA04 --description "Automated opencode upstream sync" --force >/dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          Upstream \`anomalyco/opencode@dev\` is **${{ steps.check.outputs.behind }}** commits ahead and the automated merge hit conflicts.

          Resolve locally:
          \`\`\`sh
          git fetch upstream dev && git checkout main && git merge upstream/dev
          # resolve the conflicts, then: git push
          \`\`\`

          Conflicting files:
          $(sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt")

          _Opened automatically by \`sync-upstream.yml\`._
          EOF
          TITLE="⚠️ Upstream opencode sync needs manual merge"
          EXISTING=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label upstream-sync --body-file "$RUNNER_TEMP/issue.md"
          fi
