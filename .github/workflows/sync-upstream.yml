name: Sync from opencode

# Weekly automated sync of upstream opencode (anomalyco/opencode@dev) into serac.
# Serac is a thin ADDITIVE layer on top of a SHARED opencode base, so a merge
# pulls in new opencode commits while preserving serac's own commits. On a clean
# merge it opens/updates a review PR (with a monorepo-typecheck verdict); on
# conflicts it opens/updates a tracking issue listing the files to resolve.
# Nothing lands on main without a human merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'serac-labs/serac'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git + fetch upstream opencode
        run: |
          git config user.name "serac-bot"
          git config user.email "bot@serac.build"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev

      - name: Count new upstream commits
        id: check
        run: echo "behind=$(git rev-list --count HEAD..upstream/dev)" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B sync/upstream main
          if git merge --no-edit upstream/dev; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-bun
        if: steps.merge.outputs.result == 'clean'

      - name: Typecheck the merged tree
        id: tc
        if: steps.merge.outputs.result == 'clean'
        continue-on-error: true
        run: |
          bun install || true
          if bun turbo typecheck; then
            echo "verdict=✅ monorepo typecheck green" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=⚠️ monorepo typecheck FAILED — resolve before merging" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update the sync PR
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin sync/upstream
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Automated merge of upstream \`anomalyco/opencode@dev\` into \`main\`.

          - **${{ steps.check.outputs.behind }}** new opencode commits, merged cleanly on top of serac's layer.
          - ${{ steps.tc.outputs.verdict }}

          Serac's own additions are preserved by the merge. Review the diff and merge when the checks are green.

          _Opened automatically by \`sync-upstream.yml\`._
          EOF
          TITLE="⬆️ Sync from opencode (${{ steps.check.outputs.behind }} new commits)"
          if gh pr view sync/upstream --json number >/dev/null 2>&1; then
            gh pr edit sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head sync/upstream --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Open / update the conflict issue
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync --color FBCA04 --description "Automated opencode upstream sync" --force >/dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          Upstream \`anomalyco/opencode@dev\` is **${{ steps.check.outputs.behind }}** commits ahead and the automated merge hit conflicts.

          Resolve locally:
          \`\`\`sh
          git fetch upstream dev && git checkout main && git merge upstream/dev
          # resolve the conflicts, then: git push
          \`\`\`

          Conflicting files:
          $(sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt")

          _Opened automatically by \`sync-upstream.yml\`._
          EOF
          TITLE="⚠️ Upstream opencode sync needs manual merge"
          EXISTING=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label upstream-sync --body-file "$RUNNER_TEMP/issue.md"
          fi
