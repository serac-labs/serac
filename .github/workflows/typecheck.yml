name: typecheck

# `bun typecheck` runs `turbo typecheck` across the workspace, which is now
# packages/servicenow-mcp and packages/skills.
#
# This used to trigger on push/pull_request to `dev` — opencode's default
# branch, which Serac does not use. On this repo the trigger simply never
# matched, so the workspace typecheck has not run in CI. Now on main and on
# every PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
