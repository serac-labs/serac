name: Release Test

# Dry-run variant of publish-npm.yml. Exercises the full Approach B pipeline
# (cross-compile -> sign darwin -> archive serac-core-<suffix>.{tar.gz,zip} ->
# checksums.json -> prepare package -> restore launcher) and ends in
# `npm publish --dry-run` so NOTHING is published and no GitHub release is
# created/clobbered. Use it to validate the workflow on a branch before
# touching the real Release workflow.

on:
  push:
    branches:
      - test
      - serac-test
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.16.2-test.1)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-dry-run:
    name: Build All Platforms & Dry-Run Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Pinned to a major, not `@latest`. npm 12 raised its floor to node >= 22
      # and `@latest` picked it up the day it shipped, which killed this job with
      # EBADENGINE in 27 seconds — and it stayed dead, because a release that
      # fails is only noticed when someone goes looking. A major pin still clears
      # the >= 11.5.1 that OIDC trusted publishing needs, without an engine
      # requirement moving underneath us again.
      - name: Upgrade npm (required for OIDC)
        run: npm install -g npm@^11.5.1

      - name: Configure npm for OIDC publishing
        run: |
          rm -f ~/.npmrc
          rm -f .npmrc
          rm -f /home/runner/work/_temp/.npmrc 2>/dev/null || true
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=" >> ~/.npmrc
          echo "✅ npm configured for OIDC"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            BASE_VERSION=$(cat packages/opencode/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            echo "version=${BASE_VERSION}-test.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if bun install; then
              break
            fi
            sleep 10
          done

      - name: Build ALL platform binaries (cross-compile)
        # OPENCODE_RELEASE intentionally UNSET: build.ts only emits the
        # dist/serac-core-<suffix>/bin/opencode dirs, no archives, no release upload.
        run: |
          cd packages/opencode

          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          echo "Building all platforms via cross-compilation..."
          bun run build
        env:
          OPENCODE_CHANNEL: test
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Ad-hoc sign macOS binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libplist-dev pkg-config
          git clone --depth=1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo make -C /tmp/ldid install

          shopt -s nullglob
          for bin in packages/opencode/dist/serac-core-*darwin*/bin/opencode; do
            echo "Signing $bin"
            ldid -S "$bin"
          done

      - name: List built platforms
        run: |
          cd packages/opencode/dist
          echo "Built platforms (build.ts emits serac-core-<suffix> dirs directly):"
          ls -la

      - name: Prepare package for publishing
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/opencode

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            const rootPkg = JSON.parse(fs.readFileSync('../../package.json', 'utf8'));
            const catalog = (rootPkg.workspaces && rootPkg.workspaces.catalog) || {};

            // Dry-run mirrors the real publish but under the serac-test name.
            pkg.name = 'serac-test';
            pkg.version = '$VERSION';
            pkg.description = 'Serac Test - agentic AI for ServiceNow developers';
            pkg.private = false;
            delete pkg.type;

            pkg.repository = {
              type: 'git',
              url: 'https://github.com/serac-labs/serac'
            };

            pkg.bin = {
              'serac-test': './bin/opencode',
              'serac':      './bin/opencode'
            };

            function resolveDeps(deps) {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                const val = deps[key];
                if (val.includes('workspace:')) {
                  delete deps[key];
                } else if (val === 'catalog:' || val.startsWith('catalog:')) {
                  if (catalog[key]) {
                    deps[key] = catalog[key];
                  } else {
                    console.warn('Warning: ' + key + ' not found in catalog, removing');
                    delete deps[key];
                  }
                }
              });
            }

            resolveDeps(pkg.dependencies);
            resolveDeps(pkg.devDependencies);

            if (pkg.overrides) {
              Object.keys(pkg.overrides).forEach(key => {
                const val = pkg.overrides[key];
                if (typeof val === 'string' && (val === 'catalog:' || val.startsWith('catalog:'))) {
                  if (catalog[key]) pkg.overrides[key] = catalog[key];
                  else delete pkg.overrides[key];
                }
              });
            }

            delete pkg.optionalDependencies;

            pkg.scripts = pkg.scripts || {};
            pkg.scripts.postinstall = 'node scripts/postinstall.cjs';

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          echo "Updated package.json:"
          cat package.json

      - name: Create platform archives
        # Mirror build.ts: flat bin/ contents -> dist/<slug>.{tar.gz,zip}.
        run: |
          cd packages/opencode/dist
          sudo apt-get install -y zip >/dev/null 2>&1 || true

          shopt -s nullglob
          for dir in serac-core-*/; do
            slug=$(basename "$dir")
            if [[ "$slug" == *linux* ]]; then
              echo "Creating ${slug}.tar.gz..."
              (cd "$slug/bin" && tar -czf "../../${slug}.tar.gz" *)
            else
              echo "Creating ${slug}.zip..."
              (cd "$slug/bin" && zip -r "../../${slug}.zip" *)
            fi
          done

          echo "Archives:"
          ls -la serac-core-*.tar.gz serac-core-*.zip 2>/dev/null || echo "No archives created"

      - name: Generate binary checksums (provenance-covered)
        run: |
          cd packages/opencode/dist
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const out = {};
            const files = fs.readdirSync(".").filter((x) => x.endsWith(".tar.gz") || x.endsWith(".zip")).sort();
            for (const f of files) {
              out[f] = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            }
            fs.writeFileSync("../checksums.json", JSON.stringify(out, null, 2) + "\n");
          '
          echo "Wrote packages/opencode/checksums.json:"
          cat ../checksums.json

      - name: Restore bin launcher (prevent shipping CI platform binary)
        run: |
          cd packages/opencode
          git checkout -- bin/opencode
          echo "Restored launcher script:"
          wc -c bin/opencode

      - name: Dry-run publish main package (no publish)
        run: |
          cd packages/opencode
          echo "Dry-run publishing serac-test (nothing is published)..."
          npm publish --access public --tag test --provenance --dry-run

      # No GitHub release is created in the test variant.
      # Platform binaries would be distributed via GitHub releases in the real
      # Release workflow (.github/workflows/publish-npm.yml).
