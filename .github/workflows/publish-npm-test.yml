name: Release Test

on:
  push:
    branches:
      - test
      - serac-test
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.0.0-test.1)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build All Platforms & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Upgrade npm (required for OIDC)
        run: npm install -g npm@latest

      - name: Configure npm for OIDC publishing
        run: |
          rm -f ~/.npmrc
          rm -f .npmrc
          rm -f /home/runner/work/_temp/.npmrc 2>/dev/null || true
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=" >> ~/.npmrc
          echo "✅ npm configured for OIDC"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            BASE_VERSION=$(cat packages/opencode/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            echo "version=${BASE_VERSION}-test.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if bun install; then
              break
            fi
            sleep 10
          done

      - name: Build ALL platform binaries (cross-compile)
        run: |
          cd packages/opencode

          # Update version in package.json
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          # Build ALL platforms from Linux (cross-compilation)
          echo "Building all platforms via cross-compilation..."
          bun run build
        env:
          SNOW_CODE_CHANNEL: test
          SNOW_CODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Ad-hoc sign macOS binaries
        # Unsigned arm64/x64 binaries get killed by Gatekeeper on recent macOS
        # (com.apple.provenance xattr + unsigned = SIGKILL). Bun embeds a
        # malformed placeholder signature that rcodesign refuses to overwrite,
        # so we build ldid (which is tolerant of this) from source. `ldid -S`
        # performs an ad-hoc signature, which is enough to unblock launch.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libplist-dev pkg-config
          git clone --depth=1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo make -C /tmp/ldid install

          shopt -s nullglob
          for bin in packages/opencode/dist/*darwin*/bin/serac; do
            echo "Signing $bin"
            ldid -S "$bin"
          done

      - name: List built platforms
        run: |
          cd packages/opencode/dist
          echo "Built platforms (build.ts emits serac-<os>-<arch> dirs directly):"
          ls -la

      - name: Prepare package for publishing
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/opencode

          # Update package.json for test release
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            // Read catalog from root package.json
            const rootPkg = JSON.parse(fs.readFileSync('../../package.json', 'utf8'));
            const catalog = (rootPkg.workspaces && rootPkg.workspaces.catalog) || {};

            // Change name and version, remove private flag and type
            pkg.name = 'serac-test';
            pkg.version = '$VERSION';
            pkg.description = 'Serac Test - agentic AI for ServiceNow developers';
            pkg.private = false;
            delete pkg.type; // Remove 'module' type so bin scripts can use CommonJS

            // Set repository for OIDC provenance verification
            pkg.repository = {
              type: 'git',
              url: 'https://github.com/serac-labs/serac'
            };

            // Bin commands - test channel mirrors the published bins.
            pkg.bin = {
              'serac-test': './bin/serac',
              'serac': './bin/serac'
            };

            // Helper to resolve workspace/catalog dependencies
            function resolveDeps(deps) {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                const val = deps[key];
                if (val.includes('workspace:')) {
                  // Remove workspace dependencies
                  delete deps[key];
                } else if (val === 'catalog:' || val.startsWith('catalog:')) {
                  // Resolve catalog: to actual version
                  if (catalog[key]) {
                    deps[key] = catalog[key];
                  } else {
                    // Remove if not in catalog
                    console.warn('Warning: ' + key + ' not found in catalog, removing');
                    delete deps[key];
                  }
                }
              });
            }

            resolveDeps(pkg.dependencies);
            resolveDeps(pkg.devDependencies);

            // Remove optionalDependencies - platform packages can't use OIDC
            delete pkg.optionalDependencies;

            // Add postinstall script to download binary from GitHub releases
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.postinstall = 'node scripts/postinstall.cjs';

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          echo "Updated package.json:"
          cat package.json

      - name: Create platform tarballs
        run: |
          cd packages/opencode/dist

          for dir in serac-*/; do
            if [ -d "$dir" ]; then
              platform_name=$(basename "$dir")
              echo "Creating tarball for $platform_name..."
              # Create tarball with bin/ and mcp/ directories
              tar -czf "${platform_name}.tar.gz" -C "$dir" bin mcp
              echo "Created ${platform_name}.tar.gz"
            fi
          done

          ls -la *.tar.gz 2>/dev/null || echo "No tarballs created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Serac Test v${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: false
          files: |
            packages/opencode/dist/*.tar.gz
          body: |
            ## Serac Test Release (TypeScript)

            This is a **pure TypeScript** test release - no Go dependencies!

            ### Install
            ```bash
            npm install -g serac-test@${{ steps.version.outputs.version }}
            ```

            ### Run
            ```bash
            serac-test
            # or
            serac
            ```

            ### Supported Platforms
            - ✅ Linux x64
            - ✅ Linux arm64
            - ✅ macOS arm64 (Apple Silicon)
            - ✅ macOS x64 (Intel)
            - ✅ Windows x64

            ### What's New
            - 100% TypeScript (SolidJS + OpenTUI)
            - No Go binary compilation needed
            - All 373+ ServiceNow MCP tools
            - All 53 bundled skills
            - 8 auth types (ServiceNow OAuth, Enterprise, Portal, MID Server, etc.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish main package to npm (OIDC)
        run: |
          cd packages/opencode
          echo "Publishing serac-test main package..."
          npm publish --access public --tag test --provenance

      # Platform binaries are distributed via GitHub releases
      # Users can download from: https://github.com/serac-labs/serac/releases
