name: Release

# Approach B: ONE npm package (@serac-labs/core) published via OIDC trusted
# publisher. The package ships the LAUNCHER (bin/opencode) + a postinstall
# (scripts/postinstall.cjs) that downloads the matching prebuilt platform
# binary from THIS release and verifies it against the provenance-covered
# checksums.json baked into the package.
#
# IMPORTANT: the npm Trusted Publisher for @serac-labs/core is bound to
# repo=serac-labs/serac + workflow file ".github/workflows/publish-npm.yml".
# Do NOT rename this file.
#
# Naming chain (must stay in lock-step):
#   build.ts        -> dist/serac-core-<suffix>/bin/opencode
#   THIS workflow   -> sign darwin binary, archive each dist dir to
#                      dist/serac-core-<suffix>.tar.gz (linux) / .zip (darwin,windows),
#                      checksums.json over those, upload to GH release v<version>
#   postinstall.cjs -> downloads serac-core-<suffix>.{tar.gz,zip} for v<version>, verifies, extracts to bin/.opencode
#   bin/opencode    -> execs bin/.opencode (its `cached` hook)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 9.0.0)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build All Platforms & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Determine release channel
        id: channel
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "🏷️ Tag push - stable release"
          elif [[ $GITHUB_REF == refs/heads/main || $GITHUB_REF == refs/heads/production ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "🚀 Main/production branch - stable release"
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            # Sanitize branch name for npm prerelease tag (only alphanumeric and hyphens)
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "npm_tag=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "branch_slug=$SAFE_BRANCH" >> $GITHUB_OUTPUT
            echo "🔧 Branch '$BRANCH_NAME' - dev release (npm tag: dev)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Upgrade npm (required for OIDC)
        run: npm install -g npm@latest

      - name: Configure npm for OIDC publishing
        # Trusted Publisher is wired up on @serac-labs/core, so OIDC
        # is the only auth path. The empty _authToken line is required
        # for npm to recognise OIDC mode — without it, the CLI falls
        # back to anonymous and 401s.
        run: |
          rm -f ~/.npmrc
          rm -f .npmrc
          rm -f /home/runner/work/_temp/.npmrc 2>/dev/null || true
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=" >> ~/.npmrc
          echo "npm configured for OIDC"

      - name: Debug OIDC setup
        run: |
          echo "=== npm version ==="
          npm --version
          echo "=== OIDC token available? ==="
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "✅ OIDC token request token is available"
          else
            echo "❌ OIDC token request token NOT available"
          fi
          echo "=== Release channel ==="
          echo "Channel: ${{ steps.channel.outputs.channel }}"
          echo "npm tag: ${{ steps.channel.outputs.npm_tag }}"
          echo "Prerelease: ${{ steps.channel.outputs.prerelease }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: |
          BASE_VERSION=$(cat packages/opencode/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.channel.outputs.channel }}" == "dev" ]]; then
            echo "version=${BASE_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            # Stable release. Use BASE_VERSION verbatim — `npm view` is
            # unreliable right after a name has been unpublished (the
            # GET endpoint returns "no versions" but the PUT endpoint
            # still rejects the same version as a duplicate, because
            # npm tracks unpublished versions internally for 24h).
            # Doing the bump in the source pkg.json + relying on the
            # post-publish "Bump source pkg.json" step keeps the SOT in
            # git rather than in npm's eventual-consistency registry index.
            echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "Publishing at ${BASE_VERSION} (source-driven version)"
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if bun install; then
              break
            fi
            sleep 10
          done

      - name: Build ALL platform binaries (cross-compile)
        # build.ts cross-compiles every target to dist/serac-core-<suffix>/bin/opencode.
        # OPENCODE_RELEASE is intentionally UNSET so build.ts does NOT create the
        # tarballs/zips or run `gh release upload` itself — we need to ad-hoc-sign
        # the darwin binaries BEFORE archiving, and we drive the release below.
        run: |
          cd packages/opencode

          # Update version in package.json so the build embeds the right version.
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

          echo "Building all platforms via cross-compilation..."
          bun run build
        env:
          OPENCODE_CHANNEL: ${{ steps.channel.outputs.channel }}
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Ad-hoc sign macOS binaries
        # Unsigned arm64/x64 binaries get killed by Gatekeeper on recent macOS
        # (com.apple.provenance xattr + unsigned = SIGKILL). Bun embeds a
        # malformed placeholder signature that rcodesign refuses to overwrite,
        # so we build ldid (which is tolerant of this) from source. `ldid -S`
        # performs an ad-hoc signature, which is enough to unblock launch.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libplist-dev pkg-config
          git clone --depth=1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo make -C /tmp/ldid install

          shopt -s nullglob
          for bin in packages/opencode/dist/serac-core-*darwin*/bin/opencode; do
            echo "Signing $bin"
            ldid -S "$bin"
          done

      - name: List built platforms
        run: |
          cd packages/opencode/dist
          echo "Built platforms (build.ts emits serac-core-<suffix> dirs directly):"
          ls -la

      - name: Prepare package for publishing
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd packages/opencode

          # Update package.json for release
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            // Read catalog from root package.json
            const rootPkg = JSON.parse(fs.readFileSync('../../package.json', 'utf8'));
            const catalog = (rootPkg.workspaces && rootPkg.workspaces.catalog) || {};

            // name is already @serac-labs/core in source; set version,
            // drop private + module type so bin scripts can use CommonJS.
            pkg.name = '@serac-labs/core';
            pkg.version = '$VERSION';
            pkg.description = 'Serac - agentic AI for ServiceNow developers. Bring your own keys, observable runs, deterministic traces.';
            pkg.private = false;
            delete pkg.type; // Remove 'module' type so bin scripts can use CommonJS

            // Set repository for OIDC provenance verification
            pkg.repository = {
              type: 'git',
              url: 'https://github.com/serac-labs/serac'
            };
            pkg.homepage = 'https://serac.build';
            pkg.bugs = { url: 'https://github.com/serac-labs/serac/issues' };

            // Bin commands - 'serac' is the primary CLI entry, 'serac-code'
            // an alias. Both point at the launcher (bin/opencode), which
            // execs the postinstall-downloaded binary (bin/.opencode).
            // Legacy snow-flow / snow-code aliases were dropped: they
            // collided with the bins of the still-installed, now-deprecated
            // 'snow-flow' npm package, making 'npm i -g @serac-labs/core'
            // fail with EEXIST for users migrating from snow-flow.
            pkg.bin = {
              'serac':      './bin/opencode',
              'serac-code': './bin/opencode'
            };

            // Helper to resolve workspace/catalog dependencies
            function resolveDeps(deps) {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                const val = deps[key];
                if (val.includes('workspace:')) {
                  // Remove workspace dependencies (bundled into the binary)
                  delete deps[key];
                } else if (val === 'catalog:' || val.startsWith('catalog:')) {
                  // Resolve catalog: to actual version
                  if (catalog[key]) {
                    deps[key] = catalog[key];
                  } else {
                    console.warn('Warning: ' + key + ' not found in catalog, removing');
                    delete deps[key];
                  }
                }
              });
            }

            resolveDeps(pkg.dependencies);
            resolveDeps(pkg.devDependencies);

            // Resolve catalog: refs in overrides too (root has a catalog: override)
            if (pkg.overrides) {
              Object.keys(pkg.overrides).forEach(key => {
                const val = pkg.overrides[key];
                if (typeof val === 'string' && (val === 'catalog:' || val.startsWith('catalog:'))) {
                  if (catalog[key]) pkg.overrides[key] = catalog[key];
                  else delete pkg.overrides[key];
                }
              });
            }

            // Remove optionalDependencies - platform packages can't use OIDC
            // (approach A abandoned; binary comes from the GH release instead).
            delete pkg.optionalDependencies;

            // Add postinstall to download the platform binary from the GH release
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.postinstall = 'node scripts/postinstall.cjs';

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          echo "Updated package.json:"
          cat package.json

      - name: Create platform archives
        # Mirror build.ts EXACTLY: tar/zip the CONTENTS of each dist dir's bin/
        # (flat — `opencode` lands at the archive root), output to dist/<slug>.{tar.gz,zip}.
        # linux -> .tar.gz ; darwin/windows -> .zip.
        run: |
          cd packages/opencode/dist
          sudo apt-get install -y zip >/dev/null 2>&1 || true

          shopt -s nullglob
          for dir in serac-core-*/; do
            slug=$(basename "$dir")
            if [[ "$slug" == *linux* ]]; then
              echo "Creating ${slug}.tar.gz..."
              (cd "$slug/bin" && tar -czf "../../${slug}.tar.gz" *)
            else
              echo "Creating ${slug}.zip..."
              (cd "$slug/bin" && zip -r "../../${slug}.zip" *)
            fi
          done

          echo "Archives:"
          ls -la serac-core-*.tar.gz serac-core-*.zip 2>/dev/null || echo "No archives created"

      - name: Generate binary checksums (provenance-covered)
        # SHA-256 of every platform archive, written INTO the package so
        # `npm publish --provenance` signs it. postinstall.cjs verifies the
        # archive it downloads from the GitHub release against this before
        # extracting — closing the gap between the signed npm package and
        # the separately-downloaded, otherwise-unverified executable.
        run: |
          cd packages/opencode/dist
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const out = {};
            const files = fs.readdirSync(".").filter((x) => x.endsWith(".tar.gz") || x.endsWith(".zip")).sort();
            for (const f of files) {
              out[f] = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            }
            fs.writeFileSync("../checksums.json", JSON.stringify(out, null, 2) + "\n");
          '
          echo "Wrote packages/opencode/checksums.json:"
          cat ../checksums.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Serac v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ steps.channel.outputs.channel == 'stable' }}
          files: |
            packages/opencode/dist/serac-core-*.tar.gz
            packages/opencode/dist/serac-core-*.zip
          body: |
            ## Installation

            ```bash
            npm install -g @serac-labs/core@${{ steps.version.outputs.version }}
            ```

            ## Run

            ```bash
            serac
            ```

            > Coming from `snow-flow`? The package is now `@serac-labs/core`
            > and the command is `serac`. Uninstall the old package first so
            > the install doesn't collide:
            > `npm un -g snow-flow && npm i -g @serac-labs/core`.

            ## What's New

            - 100% TypeScript (SolidJS + OpenTUI)
            - 373+ ServiceNow MCP tools (bundled in the binary)
            - 53 bundled skills
            - 8 auth types (ServiceNow OAuth, Enterprise, Portal, MID Server, etc.)
            - Enterprise integrations (Jira, Azure DevOps, Confluence, GitHub, GitLab)

            ## Platform Binaries

            Binaries are automatically downloaded during npm install and verified
            against the provenance-covered checksums shipped in the package.
            Manual download available above if needed.

            ### Supported Platforms
            - Linux x64 / arm64 (glibc + musl, avx2 + baseline)
            - macOS arm64 (Apple Silicon) / x64 (Intel)
            - Windows x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore bin launcher (prevent shipping CI platform binary)
        # Defensive: build.ts writes binaries to dist/, never to bin/opencode,
        # so the launcher in source is untouched — but restore it anyway so the
        # published package is guaranteed to ship the LAUNCHER, not a CI binary.
        run: |
          cd packages/opencode
          git checkout -- bin/opencode
          echo "Restored launcher script:"
          wc -c bin/opencode

      - name: Publish main package to npm (OIDC)
        run: |
          cd packages/opencode
          NPM_TAG="${{ steps.channel.outputs.npm_tag }}"
          echo "Publishing @serac-labs/core with tag: $NPM_TAG (OIDC, signed provenance)"

          if [ "$NPM_TAG" = "latest" ]; then
            npm publish --access public --provenance
          else
            npm publish --access public --tag "$NPM_TAG" --provenance
          fi

      - name: Publish @serac-labs/servicenow-mcp to npm (OIDC)
        # Separate npm package (ServiceNow MCP server). Unlike core (which
        # ships .ts source), this ships a built dist/, so build + rewrite
        # exports/bin from ./src/*.ts to ./dist/*.js first. Publishes via the
        # same OIDC trusted-publisher path as core (the .npmrc above already
        # put npm in OIDC mode). REQUIRES its OWN Trusted Publisher to be
        # configured on npm for @serac-labs/servicenow-mcp pointing at this
        # repo + workflow. Already independently published at 0.1.0.
        #
        # continue-on-error keeps a not-yet-configured trusted publisher (401)
        # from failing the whole release (and the core publish above). REMOVE
        # it in a follow-up once the trusted publisher is live and the first
        # OIDC publish is confirmed green.
        continue-on-error: true
        run: |
          cd packages/servicenow-mcp
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          bun run script/build-for-publish.ts
          test -f dist/index.js || { echo "build produced no dist/index.js — aborting publish"; exit 1; }
          NPM_TAG="${{ steps.channel.outputs.npm_tag }}"
          echo "Publishing @serac-labs/servicenow-mcp@$VERSION with tag: $NPM_TAG (OIDC, signed provenance)"
          if [ "$NPM_TAG" = "latest" ]; then
            npm publish --access public --provenance
          else
            npm publish --access public --tag "$NPM_TAG" --provenance
          fi

      - name: Bump source pkg.json for next publish
        # The "Get version" step publishes source verbatim. To make the
        # *next* push publish a new version (and not 403 with "version
        # already exists"), bump the patch component in source here.
        # Example: published 1.16.2 → write 1.16.3 back so the next merge
        # to main publishes 1.16.3.
        #
        # MUST be gated to a BRANCH push (refs/heads/*), NOT just channel==stable:
        # a `v*` TAG push is also 'stable', but `git checkout <tag>` lands on a
        # DETACHED HEAD, so `git push origin <tag>` fails the retry loop and
        # `exit 1`s AFTER a successful publish — turning a green run red.
        if: steps.channel.outputs.channel == 'stable' && startsWith(github.ref, 'refs/heads/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          git config user.email "bot@serac.build"
          git config user.name "serac-bot"
          git checkout ${{ github.ref_name }}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEXT_VERSION\"/" packages/opencode/package.json
          git add packages/opencode/package.json
          git diff --cached --quiet && { echo "no bump needed"; exit 0; }
          git commit -m "chore: bump source to ${NEXT_VERSION} for next publish [skip ci]"

          # Push with retry — other workflows (e.g. tools.json regen) may have
          # pushed to main during our multi-minute build. Rebase against latest
          # and retry up to 3x. --autostash is required because earlier build
          # steps leave files modified in the working tree; without it, git pull
          # --rebase aborts with "cannot pull with rebase: You have unstaged
          # changes" and the bump commit never lands — leaving npm one version
          # ahead of source on the next push (already-published-version error).
          for attempt in 1 2 3; do
            if git push origin ${{ github.ref_name }}; then
              echo "auto-bump push succeeded on attempt $attempt"
              exit 0
            fi
            echo "auto-bump push rejected (attempt $attempt) — pulling latest and retrying"
            git pull --rebase --autostash origin ${{ github.ref_name }}
          done
          echo "auto-bump push failed after 3 attempts" >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Platform binaries are distributed via GitHub releases.
      # Users download them automatically via scripts/postinstall.cjs, or
      # manually from https://github.com/serac-labs/serac/releases
