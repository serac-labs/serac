# Cloud Build Configuration for Serac TUI Server
#
# Builds and deploys the TUI WebSocket service to Cloud Run.
# Spawns PTY-backed TUI sessions over WebSocket connections.
#
# Required substitution variables:
#   _REGION: GCP region (default: europe-west4)
#   _SERVICE_NAME: Cloud Run service name (default: snow-flow-tui)
#   _ARTIFACT_REGISTRY_REPO: Artifact Registry repo (default: snow-flow-enterprise)

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  substitutionOption: "ALLOW_LOOSE"
  diskSizeGb: 50

substitutions:
  _REGION: "europe-west4"
  _SERVICE_NAME: "snow-flow-tui"
  _ARTIFACT_REGISTRY_REPO: "snow-flow-enterprise"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "10"
  _MEMORY: "2Gi"
  _CPU: "2"
  _CONCURRENCY: "20"
  _TIMEOUT: "3600s"

steps:
  # Step 0: Skip build if no relevant files changed
  - name: "gcr.io/cloud-builders/git"
    id: "check-changes"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        RELEVANT_PATHS="Dockerfile.tui cloudbuild-tui.yaml packages/opencode/ packages/util/ packages/plugin/ packages/sdk/js/ packages/ui/ packages/app/ package.json bun.lock turbo.json patches/"
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE_BUILD")
        if [ "$$CHANGED_FILES" = "FORCE_BUILD" ]; then
          echo "Could not determine changes, proceeding with build"
          exit 0
        fi
        for path in $$RELEVANT_PATHS; do
          if echo "$$CHANGED_FILES" | grep -q "^$$path"; then
            echo "Relevant change detected in $$path, proceeding with build"
            exit 0
          fi
        done
        echo "No relevant changes for TUI build, skipping"
        exit 1

  # Step 1: Pull cache image (best-effort, don't fail if missing)
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-cache"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest || true

  # Step 2: Build Docker image (no cache to ensure fresh source)
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-f"
      - "Dockerfile.tui"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
      - "--no-cache"
      - "."
    waitFor: ["pull-cache"]
    timeout: "1500s"

  # Step 3: Push both tags in parallel
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$COMMIT_SHA &
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest &
        wait
    waitFor: ["build-image"]

  # Step 4: Deploy to Cloud Run with full configuration
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --memory=${_MEMORY} \
          --cpu=${_CPU} \
          --concurrency=${_CONCURRENCY} \
          --timeout=${_TIMEOUT} \
          --port=4096 \
          --session-affinity
    waitFor: ["push-image"]

  # Step 5: Verify deployment health
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "verify-deployment"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format='value(status.url)')

        echo "Service URL: $$SERVICE_URL"

        for i in {1..6}; do
          echo "Health check attempt $$i/6..."
          HEALTH_RESPONSE=$$(curl -f -s "$$SERVICE_URL/global/health" 2>/dev/null)
          if [ $$? -eq 0 ]; then
            echo "TUI Server health check passed!"
            echo "$$HEALTH_RESPONSE"
            exit 0
          fi
          echo "Waiting 5 seconds..."
          sleep 5
        done

        echo "TUI Server health check failed after 30 seconds"
        exit 1
    waitFor: ["deploy-cloud-run"]

# Store built images
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest"

# Build timeout (30 min)
timeout: "1800s"

# Tags
tags:
  - "snow-flow"
  - "tui-server"
  - "${_SERVICE_NAME}"
